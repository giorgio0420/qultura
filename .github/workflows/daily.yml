name: daily curation

# 04:23 UTC = 06:23 in Italia con l'ora legale (07:23 con quella solare).
# Fuori dall'ora tonda di proposito: GitHub scarta i job accodati a :00 sotto carico.
# I run schedulati partono comunque in ritardo, anche di ore: e' il comportamento
# normale della piattaforma, non un errore.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# due run insieme si sovrascriverebbero data.json a vicenda
concurrency:
  group: daily-curation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit the day's reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Il job dura minuti: nel frattempo il ramo puo' essersi mosso, e un push
          # secco verrebbe rifiutato. Ci si riallinea al remoto e si riporta sopra
          # il data.json appena generato: e' un file rigenerato, e questo job e'
          # l'unico che lo scrive, quindi non c'e' nulla da fondere.
          cp data.json "$RUNNER_TEMP/data.json"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$RUNNER_TEMP/data.json" data.json
            git add data.json
            if git diff --staged --quiet; then
              echo "nessuna novita' oggi"
              exit 0
            fi
            git commit --quiet -m "data: $(date -u +%F)"
            if git push --quiet; then
              echo "pubblicato al tentativo $attempt"
              exit 0
            fi
            echo "push rifiutato, il ramo si e' mosso: riprovo"
            sleep 5
          done
          echo "::error::push fallito dopo 3 tentativi"
          exit 1
