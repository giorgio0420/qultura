name: daily curation

# 3:04 UTC = 05:04 in Italia con l'ora legale (04:04 con quella solare).
# Spostato da mezzanotte per dare margine alla diretta di Cronache di Spogliatoio
# (lun-gio, inizia le 22:30, puo' finire dopo l'una): --live-from-start scarica
# fino alla fine dello stream, poi la trascrizione Groq puo' scaglionarsi su
# un'ora intera se il rate limit orario del piano free scatta a meta'. Con
# margine anche per lo slittamento di GitHub sui job schedulati, e per essere
# pronti prima del risveglio. Fuori dall'ora tonda perche' i job accodati a :00
# vengono scartati piu' spesso.
on:
  schedule:
    - cron: "4 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# due run insieme si sovrascriverebbero data.json a vicenda
concurrency:
  group: daily-curation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit the day's reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Il job dura minuti: nel frattempo il ramo puo' essersi mosso, e un push
          # secco verrebbe rifiutato. Ci si riallinea al remoto e si riporta sopra
          # il data.json appena generato: e' un file rigenerato, e questo job e'
          # l'unico che lo scrive, quindi non c'e' nulla da fondere.
          cp data.json "$RUNNER_TEMP/data.json"
          # build.py deletes queue files (yt_transcripts/**) as it consumes them; the
          # hard reset below would silently resurrect them, so remember which ones
          # disappeared and re-delete them after realigning to the remote.
          consumed=$(git status --porcelain -- 'yt_transcripts' | awk '$1=="D"{print $2}')
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$RUNNER_TEMP/data.json" data.json
            git add data.json
            for f in $consumed; do
              [ -f "$f" ] && git rm --quiet "$f"
            done
            if git diff --staged --quiet; then
              echo "nessuna novita' oggi"
              exit 0
            fi
            git commit --quiet -m "data: $(date -u +%F)"
            if git push --quiet; then
              echo "pubblicato al tentativo $attempt"
              exit 0
            fi
            echo "push rifiutato, il ramo si e' mosso: riprovo"
            sleep 5
          done
          echo "::error::push fallito dopo 3 tentativi"
          exit 1
