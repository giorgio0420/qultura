name: daily curation

# 22:04 UTC = 00:04 in Italia con l'ora legale (23:04 con quella solare).
# Si parte a mezzanotte proprio perche' GitHub fa slittare i job schedulati anche
# di ore: con questo anticipo, pure un ritardo di quattro ore lascia il digest
# pronto prima del risveglio. Fuori dall'ora tonda perche' i job accodati a :00
# vengono scartati piu' spesso.
on:
  schedule:
    - cron: "4 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

# due run insieme si sovrascriverebbero data.json a vicenda
concurrency:
  group: daily-curation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit the day's reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Il job dura minuti: nel frattempo il ramo puo' essersi mosso, e un push
          # secco verrebbe rifiutato. Ci si riallinea al remoto e si riporta sopra
          # il data.json appena generato: e' un file rigenerato, e questo job e'
          # l'unico che lo scrive, quindi non c'e' nulla da fondere.
          cp data.json "$RUNNER_TEMP/data.json"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$RUNNER_TEMP/data.json" data.json
            git add data.json
            if git diff --staged --quiet; then
              echo "nessuna novita' oggi"
              exit 0
            fi
            git commit --quiet -m "data: $(date -u +%F)"
            if git push --quiet; then
              echo "pubblicato al tentativo $attempt"
              exit 0
            fi
            echo "push rifiutato, il ramo si e' mosso: riprovo"
            sleep 5
          done
          echo "::error::push fallito dopo 3 tentativi"
          exit 1
