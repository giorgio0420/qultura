<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qultura</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#121214">
<style>
  :root {
    --bg: #faf9f7; --card: #ffffff; --ink: #1a1a1c; --dim: #6b6b70;
    --line: #e4e1db; --accent: #8a5a2b; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1b1b1e; --ink: #e8e4dc; --dim: #9a9aa2;
      --line: #2b2b30; --accent: #d0a070; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: max(12px, env(safe-area-inset-top)) 16px 0;
  }
  h1 {
    font: 600 20px/1.2 ui-sans-serif, system-ui, sans-serif;
    margin: 4px 0 2px; letter-spacing: -.01em;
  }
  .meta { font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; color: var(--dim); }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 8px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 0 0 auto; border: 1px solid var(--line); background: transparent;
    color: var(--dim); border-radius: 999px; padding: 6px 12px; cursor: pointer;
    font: 500 13px/1 ui-sans-serif, system-ui, sans-serif; white-space: nowrap;
  }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  main { max-width: 42rem; margin: 0 auto; padding: 16px 16px 64px; }
  .day {
    font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim); margin: 26px 0 10px;
  }
  .day:first-child { margin-top: 4px; }
  article {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .src {
    font: 500 12px/1 ui-sans-serif, system-ui, sans-serif; color: var(--dim);
    display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .tag { border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
  h2 { font-size: 20px; line-height: 1.3; margin: 0 0 8px; font-weight: 600; letter-spacing: -.01em; }
  p.sum { margin: 0 0 12px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 6px 0; font-size: 16px; }
  a.orig {
    display: inline-block; margin-top: 14px; color: var(--accent);
    font: 500 13px/1 ui-sans-serif, system-ui, sans-serif; text-decoration: none;
  }
  a.orig:hover { text-decoration: underline; }
  .empty { color: var(--dim); text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<header>
  <h1>Qultura</h1>
  <div class="meta" id="meta">caricamento…</div>
  <nav id="tabs"></nav>
</header>
<main id="feed"></main>

<script>
const LABELS = {
  ai: "AI & Robotica", calcio: "Calcio", musica: "Musica",
  scacchi: "Scacchi", running: "Running", filosofia: "Filosofia",
};
const ORDER = ["ai", "calcio", "musica", "scacchi", "running", "filosofia"];
const feed = document.getElementById("feed");
const tabs = document.getElementById("tabs");
let items = [], active = "tutto";

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const day = (iso) => new Date(iso).toLocaleDateString("it-IT",
  { weekday: "long", day: "numeric", month: "long" });

function card(i) {
  const bullets = (i.bullets || []).map((b) => `<li>${esc(b)}</li>`).join("");
  return `<article>
    <div class="src">
      <span>${esc(i.source)}</span>
      <span class="tag">${esc(i.lang.toUpperCase())}</span>
      <span class="tag">${"\u25cf".repeat(i.relevance)}</span>
    </div>
    <h2>${esc(i.title)}</h2>
    <p class="sum">${esc(i.summary)}</p>
    ${bullets ? `<ul>${bullets}</ul>` : ""}
    <a class="orig" href="${esc(i.link)}" target="_blank" rel="noopener">Leggi l'originale &rarr;</a>
  </article>`;
}

function render() {
  const shown = items.filter((i) => active === "tutto" || i.category === active);
  if (!shown.length) { feed.innerHTML = `<p class="empty">Niente in questa categoria.</p>`; return; }
  let html = "", last = "";
  for (const i of shown) {
    const d = day(i.seen_at);
    if (d !== last) { html += `<div class="day">${esc(d)}</div>`; last = d; }
    html += card(i);
  }
  feed.innerHTML = html;
  window.scrollTo(0, 0);
}

function drawTabs() {
  const counts = { tutto: items.length };
  for (const i of items) counts[i.category] = (counts[i.category] || 0) + 1;
  const keys = ["tutto", ...ORDER.filter((k) => counts[k])];
  tabs.innerHTML = keys.map((k) =>
    `<button role="tab" data-k="${k}" aria-selected="${k === active}">
       ${k === "tutto" ? "Tutto" : LABELS[k]} ${counts[k]}
     </button>`).join("");
  tabs.querySelectorAll("button").forEach((b) => b.onclick = () => {
    active = b.dataset.k;
    drawTabs();
    render();
  });
}

fetch("data.json", { cache: "no-cache" })
  .then((r) => r.json())
  .then((d) => {
    items = d.items || [];
    const when = new Date(d.generated_at).toLocaleString("it-IT",
      { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    document.getElementById("meta").textContent = `${items.length} letture · aggiornato ${when}`;
    drawTabs();
    render();
  })
  .catch(() => {
    document.getElementById("meta").textContent = "nessun dato";
    feed.innerHTML = `<p class="empty">Non riesco a leggere data.json.</p>`;
  });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
