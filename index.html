<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qultura</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#121214">
<style>
  :root {
    --bg: #faf9f7; --card: #ffffff; --ink: #16161a; --dim: #6a6a72;
    --line: #e3e0da; --accent: #8a5a2b; --shadow: 0 1px 2px rgba(0,0,0,.05);
    --code: #f4f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1a1a1d; --ink: #e8e4dc; --dim: #92929c;
      --line: #2a2a30; --accent: #d0a070; --shadow: none; --code: #232329;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 3; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) 16px 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 650; margin: 2px 0; letter-spacing: -.01em; }
  .meta { font-size: 12px; color: var(--dim); }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 9px 0 8px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav[hidden] { display: none; }   /* display:flex batte l'attributo hidden */
  nav button {
    flex: 0 0 auto; border: 1px solid var(--line); background: transparent;
    color: var(--dim); border-radius: 999px; padding: 5px 11px; cursor: pointer;
    font: 500 12.5px/1 inherit; white-space: nowrap;
  }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  nav.sections { padding-bottom: 0; }
  nav.sections button { border-radius: 6px; font-weight: 600; font-size: 13px; padding: 6px 14px; }
  main { max-width: 44rem; margin: 0 auto; padding: 8px 12px 72px; }
  .day {
    font: 600 11px/1 inherit; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 20px 4px 8px; padding: 4px 0;
  }
  details {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 8px; box-shadow: var(--shadow);
  }
  details[open] { border-color: var(--dim); }
  summary { list-style: none; cursor: pointer; padding: 12px 14px; display: block; }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px;
  }
  .line1 { display: flex; gap: 7px; align-items: baseline; font-size: 11.5px; color: var(--dim); flex-wrap: wrap; }
  .line1 time { font-variant-numeric: tabular-nums; }
  .dot { opacity: .45; }
  h2 { font-size: 16.5px; line-height: 1.32; margin: 4px 0 3px; font-weight: 600; letter-spacing: -.01em; }
  .sub { font-size: 14px; color: var(--dim); line-height: 1.42; }
  .body { padding: 0 14px 14px; }
  .body p.sum { font: 16px/1.6 ui-serif, Georgia, serif; margin: 10px 0 12px; }
  .body ul { margin: 0; padding-left: 18px; }
  .body li { margin: 6px 0; font: 15px/1.55 ui-serif, Georgia, serif; }
  a.orig {
    display: inline-block; margin-top: 12px; color: var(--accent);
    font: 500 13px/1 inherit; text-decoration: none;
  }
  a.orig:hover { text-decoration: underline; }
  .empty { color: var(--dim); text-align: center; padding: 56px 16px; font-size: 15px; line-height: 1.6; }

  /* ---- sezione Libri ---- */
  .booknote { font-size: 12.5px; color: var(--dim); margin: 6px 4px 14px; }
  .mod {
    display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 7px; cursor: pointer; color: inherit;
    font: inherit; box-shadow: var(--shadow);
  }
  .mod .num {
    font-variant-numeric: tabular-nums; color: var(--accent);
    font-weight: 650; font-size: 13px; min-width: 2.4em;
  }
  .mod .t { font-size: 15.5px; line-height: 1.35; }
  .mod .note { display: block; font-size: 12.5px; color: var(--dim); margin-top: 3px; }
  .mod:hover { border-color: var(--dim); }
  .back-row {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 0; color: var(--dim); font: 600 13px/1 inherit; cursor: pointer;
    padding: 6px 4px 10px;
  }
  .reader { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 24px; }
  .reader h3 { margin: 0 0 4px; font-size: 20px; line-height: 1.25; letter-spacing: -.01em; }
  .reader .eyebrow {
    font: 600 11px/1 inherit; text-transform: uppercase; letter-spacing: .09em;
    color: var(--accent); margin-bottom: 8px;
  }
  .reader-body { font: 16.5px/1.68 ui-serif, Georgia, serif; margin-top: 14px; }
  .reader-body h3, .reader-body h4 { font-family: ui-sans-serif, system-ui, sans-serif; }
  .reader-body p { margin: 12px 0; }
  .reader-body ul, .reader-body ol { padding-left: 20px; }
  .reader-body li { margin: 7px 0; }
  .reader-body strong { font-weight: 650; }
  .reader-body table { border-collapse: collapse; font-size: 14.5px; margin: 14px 0; }
  .reader-body th, .reader-body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .reader-body pre {
    background: var(--code); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 13px; line-height: 1.5;
  }
  .reader-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em;
    background: var(--code); padding: 1px 5px; border-radius: 4px;
  }
  .reader-body pre code { background: none; padding: 0; }
  .scrollx { overflow-x: auto; }
  /* Solo i diagrammi mermaid: KaTeX disegna i radicali in SVG e una regola
     generica su svg gli spezza le radici quadrate. */
  .mermaid-slot { margin: 16px 0; }
  .mermaid-slot svg { height: auto; display: block; }
  /* le formule a blocco larghe scorrono invece di sbordare dalla pagina */
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 3px 0; }
  .navbar {
    position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    margin-top: 18px;
  }
  .navbar button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 11px 14px; cursor: pointer; font: 600 13px/1 inherit;
  }
  .navbar #back { flex: 1; }
  .navbar #prev, .navbar #next { flex: 0 0 auto; min-width: 56px; font-size: 15px; }
  .navbar button[disabled] { opacity: .35; cursor: default; }
  .navbar .mid { flex: 0 0 auto; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ---- traduzione IT/EN, meccanica: struttura invariata, cambia solo il testo ---- */
  .tr-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--accent);
    border-radius: 999px; padding: 3px 11px; cursor: pointer;
    font: 600 11.5px/1 inherit;
  }
  .tr-btn[disabled] { opacity: .5; cursor: default; }
  .trrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .trrow a.orig { margin-top: 0; }
  .reader .tr-btn { margin: 2px 0 0; }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Qultura</h1><span class="meta" id="meta">caricamento...</span></div>
  <nav class="sections" id="sections"></nav>
  <nav id="tabs"></nav>
</header>
<main id="feed"></main>

<script>
const LABELS = {
  ai: "AI & Robotica", calcio: "Calcio", musica: "Musica",
  scacchi: "Scacchi", running: "Running", filosofia: "Filosofia e cultura",
  mondo: "Mondo",
};
const ORDER = ["ai", "mondo", "calcio", "musica", "scacchi", "running", "filosofia"];
const feed = document.getElementById("feed");
const tabs = document.getElementById("tabs");
const sections = document.getElementById("sections");

let items = [], active = "tutto", section = "news", lastBatch = null;
let study = null, book = null, chapter = null, reading = null;  // stato di Libri

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------------- Traduzione IT/EN ----------------
   Meccanica, non un LLM che riscrive: ogni blocco di testo (paragrafo, voce di
   lista, titolo...) viene tradotto cosi' com'e' e rimesso al suo posto - la
   struttura (link, tabelle, formule, codice, diagrammi) resta quella originale,
   perche' i blocchi che la contengono vengono saltati del tutto. Google Translate
   come primo tentativo, MyMemory come riserva se il primo non risponde. */

const TR_CONCURRENCY = 5;

async function mtGoogle(text, target) {
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="
    + target + "&dt=t&q=" + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error("google " + r.status);
  const data = await r.json();
  return data[0].map((seg) => seg[0]).join("");
}

async function mtMyMemory(text, target, source) {
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text)
    + "&langpair=" + source + "|" + target;
  const r = await fetch(url);
  if (!r.ok) throw new Error("mymemory " + r.status);
  const data = await r.json();
  const out = data && data.responseData && data.responseData.translatedText;
  if (!out) throw new Error("mymemory: risposta vuota");
  return out;
}

async function translateOne(text, target, source) {
  try { return await mtGoogle(text, target); }
  catch (e) { return await mtMyMemory(text, target, source); }
}

async function translateBatch(texts, target, source) {
  const out = new Array(texts.length);
  let i = 0;
  async function worker() {
    while (i < texts.length) {
      const j = i++;
      out[j] = await translateOne(texts[j], target, source).catch(() => texts[j]);
    }
  }
  await Promise.all(Array.from({ length: Math.min(TR_CONCURRENCY, texts.length) }, worker));
  return out;
}

// blocchi "di prosa": salta chi contiene codice, formule o diagrammi, per non romperli
function translatableBlocks(root) {
  const sel = "h1, h2, h3, h4, p, li, blockquote, dt, dd, th, td, figcaption, .sub";
  return [...root.querySelectorAll(sel)].filter((el) =>
    !el.querySelector("code, pre, .katex, .mermaid-slot, script, style") && el.textContent.trim());
}

async function toggleTranslation(root, state, target, source) {
  const blocks = translatableBlocks(root);
  if (state.lang !== "en") {
    const need = blocks.filter((el) => !state.cache.has(el) || !state.cache.get(el).en);
    if (need.length) {
      const texts = need.map((el) => el.textContent);
      const done = await translateBatch(texts, target, source);
      need.forEach((el, k) => {
        const c = state.cache.get(el) || { orig: el.textContent };
        c.en = done[k];
        state.cache.set(el, c);
      });
    }
    blocks.forEach((el) => {
      if (!state.cache.has(el)) state.cache.set(el, { orig: el.textContent });
      el.textContent = state.cache.get(el).en || state.cache.get(el).orig;
    });
    state.lang = "en";
  } else {
    blocks.forEach((el) => {
      const c = state.cache.get(el);
      if (c) el.textContent = c.orig;
    });
    state.lang = "it";
  }
}

feed.addEventListener("click", (e) => {
  const btn = e.target.closest(".tr-btn");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const root = btn.closest("details, .reader");
  if (!root) return;
  if (!root._trState) root._trState = { lang: "it", cache: new Map() };
  const state = root._trState;
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = "...";
  toggleTranslation(root, state, "en", "it")
    .then(() => { btn.textContent = state.lang === "en" ? "IT" : "EN"; })
    .catch(() => { btn.textContent = prevLabel; })
    .finally(() => { btn.disabled = false; });
});

/* ---------------- News ---------------- */

const when = (i) => new Date(i.published_at || i.seen_at);
const dayLabel = (d) => d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
const clock = (d) => d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
const subtitle = (i) => i.subtitle || String(i.summary || "").split(". ")[0];

function card(i) {
  const d = when(i);
  const bullets = (i.bullets || []).map((b) => "<li>" + esc(b) + "</li>").join("");
  return '<details><summary>'
    + '<div class="line1"><time datetime="' + esc(d.toISOString()) + '">' + esc(clock(d)) + '</time>'
    + '<span class="dot">/</span><span>' + esc(i.source) + '</span>'
    + '<span class="dot">/</span><span>' + "●".repeat(i.relevance) + '</span></div>'
    + '<h2>' + esc(i.title) + '</h2>'
    + '<div class="sub">' + esc(subtitle(i)) + '</div>'
    + '</summary><div class="body">'
    + '<p class="sum">' + esc(i.summary) + '</p>'
    + (bullets ? '<ul>' + bullets + '</ul>' : '')
    + '<div class="trrow">'
    + '<a class="orig" href="' + esc(i.link) + '" target="_blank" rel="noopener">Leggi l&rsquo;originale &rarr;</a>'
    + '<button class="tr-btn" type="button">EN</button>'
    + '</div></div></details>';
}

function renderNews() {
  tabs.hidden = false;
  const shown = items
    .filter((i) => active === "tutto" || i.category === active)
    .sort((a, b) => when(b) - when(a));
  if (!shown.length) { feed.innerHTML = '<p class="empty">Niente in questa categoria.</p>'; return; }
  let html = "", last = "";
  for (const i of shown) {
    const d = dayLabel(when(i));
    if (d !== last) { html += '<div class="day">' + esc(d) + '</div>'; last = d; }
    html += card(i);
  }
  feed.innerHTML = html;
}

function drawTabs() {
  // il totale decide quali schede esistono (per poter sfogliare anche le
  // categorie senza novita'); il numero mostrato e' solo l'ultimo aggiornamento.
  const totals = { tutto: items.length };
  const fresh = { tutto: 0 };
  for (const i of items) {
    totals[i.category] = (totals[i.category] || 0) + 1;
    if (lastBatch && i.batch_at === lastBatch) {
      fresh[i.category] = (fresh[i.category] || 0) + 1;
      fresh.tutto++;
    }
  }
  const keys = ["tutto"].concat(ORDER.filter((k) => totals[k]));
  tabs.innerHTML = keys.map((k) =>
    '<button role="tab" data-k="' + k + '" aria-selected="' + (k === active) + '">'
    + (k === "tutto" ? "Tutto" : LABELS[k]) + " " + (fresh[k] || 0) + '</button>').join("");
  tabs.querySelectorAll("button").forEach((b) => {
    b.onclick = () => { active = b.dataset.k; nav(); };
  });
}

/* ---------------- Libri ---------------- */

let libsReady = null;
function loadLibs() {
  // marked, KaTeX e mermaid servono solo qui: si caricano alla prima apertura
  if (libsReady) return libsReady;
  const css = (href) => {
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = href; document.head.appendChild(l);
  };
  const js = (src) => new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
  css("https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css");
  libsReady = Promise.all([
    js("https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"),
    js("https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js")
      .then(() => js("https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js")),
    js("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js")
      .then(() => window.mermaid.initialize({
        startOnLoad: false,
        theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral",
      })),
  ]).catch(() => null);
  return libsReady;
}

const books = () => (study && study.subjects) || [];
const subject = () => books().find((s) => s.slug === book) || null;
const chapters = () => [...new Set(subject().modules.map((m) => m.chapter))].sort((a, b) => a - b);
const modulesOf = (c) => subject().modules.filter((m) => m.chapter === c);

function row(kind, key, lead, title, note) {
  return '<button class="mod" data-kind="' + kind + '" data-key="' + esc(key) + '">'
    + '<span class="num">' + esc(lead) + '</span>'
    + '<span class="t">' + esc(title)
    + (note ? '<span class="note">' + esc(note) + '</span>' : '')
    + '</span></button>';
}

function backRow(label, handler) {
  return '<button class="back-row">&larr; ' + esc(label) + '</button>';
}

function bind(handlers) {
  feed.querySelectorAll(".mod").forEach((b) => {
    b.onclick = () => handlers[b.dataset.kind](b.dataset.key);
  });
  const back = feed.querySelector(".back-row");
  if (back) back.onclick = handlers.back;
}

function renderBookList() {
  feed.innerHTML = '<p class="booknote">Note di studio, un libro per materia.</p>'
    + books().map((s) => row("book", s.slug, s.modules.length + " mod.", s.label, s.book)).join("");
  bind({ book: (slug) => { book = slug; nav(); } });
}

function renderChapterList() {
  const s = subject();
  feed.innerHTML = backRow("Libri")
    + '<p class="booknote">' + esc(s.label) + ' &middot; <em>' + esc(s.book) + '</em></p>'
    + chapters().map((c) => {
        const mods = modulesOf(c);
        const meta = (s.chapters || []).find((x) => x.n === c);
        return row("chapter", String(c), "Cap. " + c,
                   meta ? meta.title : "Capitolo " + c,
                   mods.length + " moduli · dal " + mods[0].number + " al " + mods[mods.length - 1].number);
      }).join("");
  bind({ chapter: (c) => { chapter = Number(c); nav(); },
         back: () => { book = null; chapter = null; nav(); } });
}

function renderModuleList() {
  feed.innerHTML = backRow("Capitoli")
    + '<p class="booknote">Capitolo ' + chapter + ' &middot; ' + esc(subject().label) + '</p>'
    + modulesOf(chapter).map((m) => row("mod", m.number, m.number, m.title)).join("");
  bind({ mod: (n) => { reading = n; nav(); },
         back: () => { chapter = null; nav(); } });
}

function renderReader() {
  const all = subject().modules;
  const idx = all.findIndex((m) => m.number === reading);
  const m = all[idx];
  feed.innerHTML = '<article class="reader">'
    + '<div class="eyebrow">Modulo ' + esc(m.number) + '</div>'
    + '<h3>' + esc(m.title) + '</h3>'
    + '<button class="tr-btn" type="button">EN</button>'
    + '<div class="reader-body" id="rbody"></div>'
    + '</article>'
    + '<div class="navbar">'
    + '<button id="prev"' + (idx === 0 ? " disabled" : "") + '>&larr;</button>'
    + '<button id="back">Capitolo ' + m.chapter + ' &middot; ' + (idx + 1) + '/' + all.length + '</button>'
    + '<button id="next"' + (idx === all.length - 1 ? " disabled" : "") + '>&rarr;</button>'
    + '</div>';

  const go = (j) => { reading = all[j].number; chapter = all[j].chapter; nav(); };
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  if (idx > 0) prev.onclick = () => go(idx - 1);
  if (idx < all.length - 1) next.onclick = () => go(idx + 1);
  document.getElementById("back").onclick = () => { reading = null; nav(); };

  const target = document.getElementById("rbody");
  loadLibs().then(() => {
    if (!window.marked) { target.textContent = m.body; return; }
    // i blocchi mermaid vanno estratti prima che marked li tratti come codice
    const diagrams = [];
    const src = m.body.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => {
      diagrams.push(code);
      return "\n<div class=\"mermaid-slot\" data-i=\"" + (diagrams.length - 1) + "\"></div>\n";
    });
    target.innerHTML = window.marked.parse(src);
    target.querySelectorAll("table, pre").forEach((el) => {
      if (el.tagName === "TABLE") {
        const w = document.createElement("div");
        w.className = "scrollx";
        el.parentNode.insertBefore(w, el); w.appendChild(el);
      }
    });
    if (window.renderMathInElement) {
      window.renderMathInElement(target, {
        delimiters: [{ left: "$$", right: "$$", display: true },
                     { left: "$", right: "$", display: false }],
        throwOnError: false,
      });
    }
    if (window.mermaid) {
      target.querySelectorAll(".mermaid-slot").forEach((slot, k) => {
        const id = "mmd" + Date.now() + "-" + k;
        window.mermaid.render(id, diagrams[Number(slot.dataset.i)])
          .then(({ svg }) => { slot.innerHTML = '<div class="scrollx">' + svg + "</div>"; })
          .catch(() => { slot.remove(); });
      });
    }
    window.scrollTo(0, 0);
  });
}

function renderLibri() {
  tabs.hidden = true;                       // qui si naviga scorrendo, non a schede
  if (!study) { feed.innerHTML = '<p class="empty">Carico i moduli...</p>'; return; }
  if (!books().length) {
    feed.innerHTML = '<p class="empty">Nessun modulo disponibile.</p>';
    return;
  }
  if (reading) renderReader();
  else if (chapter !== null) renderModuleList();
  else if (book !== null) renderChapterList();
  else renderBookList();
  window.scrollTo(0, 0);
}

/* ---------------- routing ---------------- */

function render() {
  if (section === "libri") { renderLibri(); return; }
  renderNews();
  window.scrollTo(0, 0);
}

function drawSections() {
  const list = [["news", "News"], ["libri", "Libri"]];
  sections.innerHTML = list.map((s) =>
    '<button role="tab" data-s="' + s[0] + '" aria-selected="' + (s[0] === section) + '">'
    + s[1] + '</button>').join("");
  sections.querySelectorAll("button").forEach((b) => {
    b.onclick = () => { section = b.dataset.s; nav(); };
  });
}

/* ---------------- history (il tasto indietro naviga nell'app, non ne esce) --- */

function snapshot() { return { section, active, book, chapter, reading }; }

function applyState(s) {
  section = s.section || "news";
  active = s.active || "tutto";
  book = s.book != null ? s.book : null;
  chapter = s.chapter != null ? s.chapter : null;
  reading = s.reading != null ? s.reading : null;
}

// da chiamare dopo ogni cambio di stato: registra una voce di history e ridisegna
function nav() {
  history.pushState(snapshot(), "");
  drawSections(); drawTabs(); render();
}

window.addEventListener("popstate", (e) => {
  applyState(e.state || {});
  drawSections(); drawTabs(); render();
});

Promise.all([
  fetch("data.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => ({ items: [] })),
  fetch("study.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => null),
]).then(([d, s]) => {
  items = d.items || [];
  study = s;
  lastBatch = d.generated_at || null;
  const upd = d.generated_at
    ? new Date(d.generated_at).toLocaleString("it-IT",
        { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    : "-";
  const nmod = s && s.subjects ? s.subjects.reduce((a, x) => a + x.modules.length, 0) : 0;
  document.getElementById("meta").textContent =
    items.length + " letture / " + nmod + " moduli / agg. " + upd;
  history.replaceState(snapshot(), "");
  drawSections(); drawTabs(); render();
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
